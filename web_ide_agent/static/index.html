<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Web IDE Agent Chat</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; padding: 0; display:flex; flex-direction:column; height:100vh }
      header { background:#111; color:#fff; padding:12px 16px }
      #container { display:flex; flex-direction:column; padding:12px; flex:1; overflow:auto }
      #messages { flex:1; overflow:auto; padding:8px; border:1px solid #eee; margin-bottom:8px; }
      .msg { padding:8px; margin:6px 0; border-radius:6px }
      .user { background:#daf1ff }
      .bot { background:#f1f1f1 }
      form { display:flex; gap:8px }
      textarea { flex:1; min-height:48px }
      button { padding:8px 14px }
    </style>
  </head>
  <body>
    <header>
      <strong>Web IDE Agent Chat</strong>
    </header>
    <div id="container">
      <div id="messages"></div>
      <form id="form">
        <textarea id="input" placeholder="Ask the agent..."></textarea>
        <button type="submit">Send</button>
      </form>
      <div style="font-size:12px;color:#666;margin-top:8px">Powered by Gemini (via repo secret / ADC)</div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
